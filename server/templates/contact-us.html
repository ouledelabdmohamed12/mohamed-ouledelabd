<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef1f3; padding:24px 12px; font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; background-color:#ffffff; border-radius:10px; overflow:hidden;">

        <!-- En-tête -->
        <tr>
          <td style="background-color:#0f1115; padding:0;">
            <img src="https://kodaatlas.com/og-image.png" alt="Koda Atlas" width="600" style="display:block; width:100%; max-width:600px; height:auto; border:0;" />
          </td>
        </tr>

        <!-- Titre -->
        <tr>
          <td style="padding:32px 32px 8px 32px;">
            <p style="margin:0 0 6px 0; font-size:13px; color:#5f6b76;">Nouvelle demande de contact</p>
            <h1 style="margin:0; font-size:24px; line-height:1.3; color:#0f1115; font-weight:700;">{{name}}</h1>
          </td>
        </tr>

        <!-- Projet et budget -->
        <tr>
          <td style="padding:16px 32px 8px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td width="50%" valign="top" style="padding:14px 16px; background-color:#f2f7f8; border-radius:8px 0 0 8px; border-right:2px solid #ffffff;">
                  <p style="margin:0 0 4px 0; font-size:12px; color:#5f6b76;">Type de projet</p>
                  <p style="margin:0; font-size:15px; font-weight:600; color:#0f1115;">{{projectType}}</p>
                </td>
                <td width="50%" valign="top" style="padding:14px 16px; background-color:#f2f7f8; border-radius:0 8px 8px 0;">
                  <p style="margin:0 0 4px 0; font-size:12px; color:#5f6b76;">Budget</p>
                  <p style="margin:0; font-size:15px; font-weight:600; color:#0f1115;">{{budget}}</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Message -->
        <tr>
          <td style="padding:20px 32px 8px 32px;">
            <p style="margin:0 0 8px 0; font-size:13px; font-weight:600; color:#0f1115;">Message</p>
            <div style="border-left:3px solid #2596a8; padding:4px 0 4px 16px; font-size:15px; line-height:1.6; color:#2b3138; white-space:pre-wrap;">{{message}}</div>
          </td>
        </tr>

        <!-- Coordonnées -->
        <tr>
          <td style="padding:24px 32px 8px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-size:14px; color:#2b3138;">
              <tr>
                <td width="110" style="padding:10px 0; border-top:1px solid #e5e8eb; color:#5f6b76;">Email</td>
                <td style="padding:10px 0; border-top:1px solid #e5e8eb;"><a href="mailto:{{email}}" style="color:#1d7f90; text-decoration:none;">{{email}}</a></td>
              </tr>
              <tr>
                <td style="padding:10px 0; border-top:1px solid #e5e8eb; color:#5f6b76;">Téléphone</td>
                <td style="padding:10px 0; border-top:1px solid #e5e8eb;"><a href="tel:{{phone}}" style="color:#1d7f90; text-decoration:none;">{{phone}}</a></td>
              </tr>
              <tr>
                <td style="padding:10px 0; border-top:1px solid #e5e8eb; color:#5f6b76;">Site web</td>
                <td style="padding:10px 0; border-top:1px solid #e5e8eb;"><a href="{{website}}" style="color:#1d7f90; text-decoration:none;">{{website}}</a></td>
              </tr>
              <tr>
                <td style="padding:10px 0; border-top:1px solid #e5e8eb; color:#5f6b76;">Langue</td>
                <td style="padding:10px 0; border-top:1px solid #e5e8eb;">{{language}}</td>
              </tr>
              <tr>
                <td style="padding:10px 0; border-top:1px solid #e5e8eb; border-bottom:1px solid #e5e8eb; color:#5f6b76;">Origine</td>
                <td style="padding:10px 0; border-top:1px solid #e5e8eb; border-bottom:1px solid #e5e8eb; font-size:13px; color:#5f6b76;">{{utm}}</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Bouton -->
        <tr>
          <td style="padding:24px 32px 32px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background-color:#0f1115; border-radius:6px;">
                  <a href="mailto:{{email}}?subject=Votre%20demande%20Koda%20Atlas" style="display:inline-block; padding:12px 22px; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none;">Répondre à {{name}}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>

      <!-- Pied de page -->
      <p style="max-width:600px; margin:16px auto 0 auto; font-size:12px; color:#8a939c; text-align:center;">
        Envoyé depuis le formulaire de contact de kodaatlas.com
      </p>
    </td>
  </tr>
</table>
