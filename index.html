<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/koda-atlas-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>Koda Atlas — Développement web et mobile à Marrakech</title>
    <meta
      name="description"
      content="Koda Atlas est un studio de développement web et mobile à Marrakech : sites vitrines, boutiques e-commerce, applications web, SaaS et applications mobiles sur-mesure. Devis gratuit, partout au Maroc."
    />
    <meta name="author" content="Koda Atlas" />

    <!-- Canonical: static so crawlers that don't execute JavaScript still see it.
         useSEO rewrites it per route at runtime. -->
    <link rel="canonical" href="https://kodaatlas.com/" />

    <!-- Open Graph — this is all Facebook/Instagram/LinkedIn ever read: their
         scrapers do NOT run JavaScript, so the runtime useSEO tags are
         invisible to them. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Koda Atlas" />
    <meta property="og:title" content="Koda Atlas — Développement web et mobile à Marrakech" />
    <meta
      property="og:description"
      content="Studio de développement web et mobile à Marrakech : sites vitrines, e-commerce, applications web, SaaS et applications mobiles sur-mesure. Devis gratuit, partout au Maroc."
    />
    <meta property="og:url" content="https://kodaatlas.com/" />
    <meta property="og:image" content="https://kodaatlas.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://kodaatlas.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Koda Atlas — studio de développement web et mobile, Marrakech" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Koda Atlas — Développement web et mobile à Marrakech" />
    <meta
      name="twitter:description"
      content="Studio de développement web et mobile à Marrakech : sites vitrines, e-commerce, applications web, SaaS et mobile sur-mesure. Devis gratuit, partout au Maroc."
    />
    <meta name="twitter:image" content="https://kodaatlas.com/og-image.png" />
    <meta name="twitter:image:alt" content="Koda Atlas — studio de développement web et mobile, Marrakech" />

    <!-- Structured data for local SEO.
         NOTE: "telephone" and "email" below are the only copies of the contact
         details not derived from src/utils/data.js (CONTACT_PHONE_E164 and
         CONTACT_EMAIL) — this is static markup served before any JavaScript
         runs, so it cannot import them. Update both together. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Koda Atlas",
        "image": "https://kodaatlas.com/og-image.png",
        "url": "https://kodaatlas.com/",
        "telephone": "+212770324267",
        "email": "contact@kodaatlas.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Marrakech",
          "addressCountry": "MA"
        },
        "areaServed": [
          { "@type": "City", "name": "Marrakech" },
          { "@type": "City", "name": "Casablanca" },
          { "@type": "City", "name": "Rabat" },
          { "@type": "Country", "name": "Morocco" }
        ],
        "serviceType": "Full-stack web and mobile application development",
        "knowsAbout": [
          "Full-stack development",
          "React.js",
          "React Native",
          "Flutter",
          "Java",
          "Spring Boot",
          "Laravel",
          "PostgreSQL",
          "Test automation",
          "Selenium",
          "Robot Framework",
          "SonarQube",
          "JUnit"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Development services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Showcase websites",
                "description": "A fast, polished website that presents a business clearly and converts visitors into leads."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "E-commerce stores",
                "description": "Complete online stores, optimized and ready to sell, with international payment processing."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Web applications",
                "description": "Custom web apps and business dashboards built with React and Java Spring Boot."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "SaaS products",
                "description": "Full-stack SaaS platforms built to scale, with subscriptions, user management and secure architecture."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Mobile applications",
                "description": "Native and cross-platform mobile apps built with React Native and Flutter."
              }
            }
          ]
        },
        "founder": {
          "@type": "Person",
          "name": "Mohamed Ouledelabd",
          "jobTitle": "Full-Stack Software Engineer"
        },
        "sameAs": [
          "https://www.linkedin.com/in/mohamed-ouledelabd/",
          "https://github.com/ouledelabdmohamed12"
        ],
        "priceRange": "$$"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
